name: Bright Incremental API Scan

on:
  workflow_dispatch:

jobs:
  bright_api_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Upload Swagger file (if needed)
        id: upload
        run: |
          echo "::notice::Assuming your Swagger file is already accessible in the repo as './swagger.json'"
          # If you need to upload to Bright first, use the upload-file action:
          # echo "file_id=$(some_upload_command)" >> $GITHUB_OUTPUT

      - name: Run Discovery
        id: discovery
        uses: NeuraLegion/bright-github-actions/run-discovery@v1
        with:
          api_token: ${{ secrets.BRIGHT_API_TOKEN }}
          project_id: ${{ secrets.BRIGHT_PROJECT_ID }}
          discovery_types: |
            [ "oas" ]
          file_path: './swagger.json'

      - name: Wait for Discovery to Complete
        id: wait_discovery
        uses: NeuraLegion/bright-github-actions/wait-for-discovery@v1
        with:
          api_token: ${{ secrets.BRIGHT_API_TOKEN }}
          discovery_id: ${{ steps.discovery.outputs.id }}
          project_id: ${{ secrets.BRIGHT_PROJECT_ID }}
          timeout: 600

      - name: List New/Changed Entry Points
        id: list_eps
        uses: NeuraLegion/bright-github-actions/list-entrypoints@v1
        with:
          api_token: ${{ secrets.BRIGHT_API_TOKEN }}
          project_id: ${{ secrets.BRIGHT_PROJECT_ID }}
          status: |
            [ "new", "changed" ]

      - name: Fail if No Entry Points Found
        if: ${{ steps.list_eps.outputs.entrypoints == '[]' }}
        run: |
          echo "::error::No new or changed entry points found. Skipping scan."
          exit 1

      - name: Run Vulnerability Scan
        id: scan
        uses: NeuraLegion/bright-github-actions/run-scan@v1
        with:
          api_token: ${{ secrets.BRIGHT_API_TOKEN }}
          project_id: ${{ secrets.BRIGHT_PROJECT_ID }}
          name: "API Scan - ${{ github.run_id }}"
          entrypoints: ${{ steps.list_eps.outputs.entrypoints }}

      - name: Wait for Scan Completion
        uses: NeuraLegion/bright-github-actions/wait-for@v1
        with:
          api_token: ${{ secrets.BRIGHT_API_TOKEN }}
          scan: ${{ steps.scan.outputs.id }}
          wait_for: any
          code_scanning_alerts: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          timeout: 900
