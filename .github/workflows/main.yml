name: Run Bright API Scan

on:
  pull_request:
    branches:
      - '**'

  push:
    branches:
      - stable
      - unstable
      
env:
  API_TOKEN: ${{ secrets.BRIGHT_API_TOKEN }}
  PROJECT_ID: ${{ secrets.BRIGHT_PROJECT_ID }}
  ARCHIVE_PATH: ${{ secrets.BRIGHT_ARCHIVE_PATH }}

jobs:
  api-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate archive file exists
        run: |
          if [ ! -f "${{ github.workspace }}/${{ env.ARCHIVE_PATH }}" ]; then
            echo "::error::Archive file not found at path: ${{ env.ARCHIVE_PATH }}" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Upload archive
        id: upload
        run: |
          ARCHIVE_FILE="$(basename ${{ env.ARCHIVE_PATH }})"
          ARCHIVE_DIR="$(dirname ${{ env.ARCHIVE_PATH }})"

          archiveID=$(docker run --rm \
            -v "${{ github.workspace }}/${ARCHIVE_DIR}:/app" \
            brightsec/cli \
            archive:upload \
            --type openapi \
            --token "$API_TOKEN" \
            --project-id "$PROJECT_ID" \
            "/app/${ARCHIVE_FILE}")

          echo "archiveID=$archiveID" >> $GITHUB_OUTPUT

      - name: Start discovery scan
        id: discovery
        run: |
          dscan_id=$(docker run --rm \
            brightsec/cli discovery:run \
            --archive "${{ steps.upload.outputs.archiveID }}" \
            --token "$API_TOKEN" \
            --project "$PROJECT_ID" \
            --name "api discovery")

          echo "dscan_id=$dscan_id" >> $GITHUB_OUTPUT

      - name: Poll discovery status
        run: |
          while true; do
            output=$(docker run --rm \
              brightsec/cli discovery:polling \
              --interval 2000 \
              --timeout 2 \
              --token "$API_TOKEN" \
              --project "$PROJECT_ID" \
              "${{ steps.discovery.outputs.dscan_id }}")

            status=$(echo "$output" | grep -io 'Discovery status is [a-z]\+' || echo "")
            echo "$status" >> $GITHUB_OUTPUT

            case "$status" in
              *complete*) break;;
              *aborted*|*failed*) exit 1;;
              *) sleep 2;;
            esac
          done

      - name: Get entrypoints
        run: |
          docker run --rm brightsec/cli entrypoints:list \
            --token "$API_TOKEN" \
            --project "$PROJECT_ID" \
            --limit 500 \
            --status new --status changed > entrypoints.json

          if [ ! -f entrypoints.json ]; then
            echo "entrypoints.json not found" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Format entrypoint IDs
        id: ids
        run: |
          ids=$(grep -o '"id": *"[^"]*"' entrypoints.json | sed 's/.*: *"//' | sed 's/"$//' | tr '\n' ' ')
          entryPoints=""
          for id in $ids; do entryPoints+="-e $id "; echo "$id"; done

          if [ -z "$entryPoints" ]; then
            echo "No entrypoints found" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "entryPoints=$entryPoints" >> $GITHUB_OUTPUT

      - name: Run API scan
        run: |
          timestamp=$(date +'%Y-%m-%d_%H-%M-%S')
          scan_name="API scan $timestamp"

          docker run --rm brightsec/cli scan:run \
            --token "$API_TOKEN" \
            --project "$PROJECT_ID" \
            --bucket "api" \
            --name "$scan_name" \
            --entrypoint ${{ steps.ids.outputs.entryPoints }}
