name: Bright API Scan

on:
  workflow_dispatch:

jobs:
  call-bright-scan:
    uses: mfeferman-bs/bright-api-scan/.github/workflows/bright-api-scan-update.yml@main
    with:
      archive_path: ./swagger.json
      scan_name: "Incremental API Scan"
    secrets:
      BRIGHT_API_TOKEN: ${{ secrets.BRIGHT_API_TOKEN }}
      BRIGHT_PROJECT_ID: ${{ secrets.BRIGHT_PROJECT_ID }}
      BRIGHT_REPEATER_ID: ${{ secrets.BRIGHT_REPEATER_ID }}
