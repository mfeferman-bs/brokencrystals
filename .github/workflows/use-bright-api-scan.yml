name: Call Bright API Scan Workflow

on:
  workflow_dispatch:
  
jobs:
  call-bright-scan:
    uses: mfeferman-bs/brokencrystals/.github/workflows/bright-api-incremental-scan.yml@main
    with:
      archive_path: ./swagger.json
      scan_name: "Incremental API Scan"
    secrets:
      BRIGHT_API_TOKEN: ${{ secrets.BRIGHT_API_TOKEN }}
      BRIGHT_PROJECT_ID: ${{ secrets.BRIGHT_PROJECT_ID }}
      GITHUB_TOKEN: ${{ secrets.KEY_GITHUB }}
